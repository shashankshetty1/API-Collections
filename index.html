<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Mini Page</title>
  <style>
    :root {
      --bg-top: #f4efe7;
      --bg-bottom: #dbe7f5;
      --card: rgba(255, 255, 255, 0.72);
      --text: #18222f;
      --accent: #db5a42;
      --accent-soft: #f5c8ae;
      --shadow: rgba(24, 34, 47, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 35%),
        linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    }

    .orb {
      position: fixed;
      width: 280px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(14px);
      opacity: 0.55;
      z-index: 0;
      animation: drift 10s ease-in-out infinite;
    }

    .orb-one {
      top: 8%;
      left: 10%;
      background: rgba(219, 90, 66, 0.25);
    }

    .orb-two {
      right: 8%;
      bottom: 10%;
      background: rgba(85, 136, 196, 0.28);
      animation-delay: -4s;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 540px);
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(12px);
      animation: rise 1s ease-out both;
    }

    .badge {
      display: inline-block;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: rgba(219, 90, 66, 0.12);
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
    }

    h1 {
      margin: 1rem 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1;
    }

    p {
      margin: 0 0 1.5rem;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 34ch;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.6rem;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(24, 34, 47, 0.7);
    }

    .meta span {
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: rgba(24, 34, 47, 0.06);
    }

    .pulse-line {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(24, 34, 47, 0.08);
      overflow: hidden;
    }

    .pulse-line::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      animation: slide 2.4s ease-in-out infinite;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slide {
      0%,
      100% {
        transform: translateX(-10%);
      }
      50% {
        transform: translateX(170%);
      }
    }

    @keyframes drift {
      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(18px, -22px, 0) scale(1.08);
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>

  <main class="card">
    <span class="badge">API Testing Repo</span>
    <h1>Library API Collection.</h1>
    <p>
      This repository contains API testing assets for library workflows, including requests to add, fetch, and delete book records with reusable Postman collection setup.
    </p>
    <div class="meta">
      <span>Postman Collection</span>
      <span>CRUD Flow Checks</span>
      <span>Response Validation</span>
    </div>
    <div class="pulse-line" aria-hidden="true"></div>
  </main>
</body>
</html>
